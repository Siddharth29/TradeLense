[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto
# Kill any test stuck >60s (a hung MT5/Mongo call once froze the suite for 10+ min)
timeout = 60
timeout_method = thread
markers =
    integration: marks tests as integration tests (may be slow)
    unit: marks tests as unit tests (fast)
    behavioral: marks tests as behavioral tests
    mt5: marks tests that require MT5 connection
